name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Build SDRScanner.exe and self-test it
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Python python

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SDRScanner-win64
          path: |
            dist/SDRScanner-*-win64.zip
            dist/selftest.txt
          if-no-files-found: error

  release:
    # Push a tag like v0.1.0 to publish the zip as a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SDRScanner-win64
      - uses: softprops/action-gh-release@v2
        with:
          files: SDRScanner-*-win64.zip
          generate_release_notes: true
