name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.0.1). Leave empty to only build. Run from main."
        required: false
        default: ""

permissions:
  contents: read

env:
  # Tag being released: a pushed v* tag, or the manual-run input (main only).
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag) || '' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Check release tag matches the app version
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          $v = (python -c "import sdrscanner; print(sdrscanner.__version__)").Trim()
          if ("v$v" -ne $env:RELEASE_TAG) { throw "Release tag $env:RELEASE_TAG does not match sdrscanner.__version__ ($v)" }

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Build SDRScanner.exe and self-test it
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Python python

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SDRScanner-win64
          path: |
            dist/SDRScanner-*-win64.zip
            dist/selftest.txt
          if-no-files-found: error

  release:
    # Push a tag like v0.0.1, or run this workflow manually on main with
    # release_tag set, to publish the zip as a GitHub release. A manual run
    # creates the tag on the commit it built.
    if: needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SDRScanner-win64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: SDR Scanner ${{ env.RELEASE_TAG }}
          files: SDRScanner-*-win64.zip
          generate_release_notes: true
