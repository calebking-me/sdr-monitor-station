[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sdrscanner"
version = "0.1.0"
description = "Multi-channel FM voice scanner for RTL-SDR"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PySide6>=6.5",
    "pyqtgraph>=0.13.3",
    "sounddevice>=0.4.6",
    "pyrtlsdr[lib]>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
sdrscanner = "sdrscanner.__main__:main"

[tool.setuptools.packages.find]
include = ["sdrscanner*"]

[tool.setuptools.package-data]
"sdrscanner.gui" = ["icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
